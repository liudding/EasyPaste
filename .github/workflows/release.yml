name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        
    - name: Set default version
      if: "!startsWith(github.ref, 'refs/tags/v')"
      run: |
        echo "VERSION=0.0.0" >> $GITHUB_ENV
        
    - name: Build EasyPaste.app
      run: |
        export ARCH=$(uname -m)
        bash scripts/package.sh
        
    - name: Verify the bundle
      run: |
        test -x dist/EasyPaste.app/Contents/MacOS/EasyPaste
        codesign --verify --deep --strict dist/EasyPaste.app
        test -d dist/EasyPaste.app/Contents/Frameworks/Sparkle.framework
        
    - name: Create DMG
      run: |
        mkdir -p dmg_temp
        cp -R dist/EasyPaste.app dmg_temp/
        ln -s /Applications dmg_temp/Applications
        hdiutil create -volname "EasyPaste" \
          -srcfolder dmg_temp \
          -ov \
          -format UDZO \
          "EasyPaste-${VERSION}.dmg"
        rm -rf dmg_temp
        
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: EasyPaste-${{ env.VERSION }}
        path: EasyPaste-${{ env.VERSION }}.dmg
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: EasyPaste-${{ env.VERSION }}.dmg
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
