# ============================================================================
# EasyPaste — GitHub Actions 自动打包发布（ad-hoc 签名版）
#
# 无需 Apple Developer 账号，使用 ad-hoc 签名 + 手动安装引导
# 触发条件：创建 tag v* 时自动运行，或手动触发
# ============================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: '跳过公证（ad-hoc 签名时无需公证）'
        type: boolean
        default: true
        required: false

permissions:
  contents: write   # 创建 Release 和上传资产

env:
  APP_NAME: EasyPaste
  BUNDLE_ID: com.easypaste.app

jobs:
  # ──────────────────────────────────────────────
  # Job 1: 构建 DMG 并上传到 Release
  # ──────────────────────────────────────────────
  build:
    name: Build DMG
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_path: ${{ steps.package.outputs.dmg_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install dependencies
        run: |
          brew install create-dmg jq python3

      # ── 下载 Sparkle.framework ──
      - name: Setup Sparkle
        run: |
          SPARKLE_VERSION="2.8.1"
          SPARKLE_DIR="$HOME/.cache/sparkle-${SPARKLE_VERSION}"
          
          if [ ! -d "$SPARKLE_DIR" ]; then
            curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
              -o /tmp/sparkle.tar.xz
            tar -xJf /tmp/sparkle.tar.xz -C /tmp/
            for dir in /tmp/Sparkle-*/Sparkle.framework /tmp/Sparkle*/bin/Sparkle.framework; do
              if [ -d "$dir" ]; then
                cp -R "$dir" "$SPARKLE_DIR"
                break
              fi
            done
            rm -f /tmp/sparkle.tar.xz
          fi
          
          echo "SPARKLE_FRAMEWORK=$SPARKLE_DIR" >> "$GITHUB_ENV"

      # ── 构建 SPM 项目 ──
      - name: Build with Swift Package Manager
        run: |
          swift build -c release
          echo "✓ SPM build completed"

      # ── 组装 .app Bundle ──
      - name: Assemble App Bundle
        id: assemble
        run: |
          set -euo pipefail
          # swift build -c release 输出到 .build/release/，不是 debug 路径
          BIN_PATH="$GITHUB_WORKSPACE/.build/release/$APP_NAME"
          if [ ! -f "$BIN_PATH" ]; then
            echo "❌ Binary not found at $BIN_PATH"
            echo "Available binaries:"
            find "$GITHUB_WORKSPACE/.build" -name "$APP_NAME" -type f 2>/dev/null || true
            exit 1
          fi
          APP_BUNDLE="$GITHUB_WORKSPACE/dist/$APP_NAME.app"
          
          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Frameworks"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          
          cp "$BIN_PATH" "$APP_BUNDLE/Contents/MacOS/$APP_NAME"
          chmod +x "$APP_BUNDLE/Contents/MacOS/$APP_NAME"
          
          # 拷贝 Info.plist（含 CFBundleIconFile、CFBundleShortVersionString 等）
          if [ -f "$GITHUB_WORKSPACE/Info.plist" ]; then
            cp "$GITHUB_WORKSPACE/Info.plist" "$APP_BUNDLE/Contents/Info.plist"
            echo "✓ Info.plist copied"
          fi
          
          # 拷贝 AppIcon.icns
          if [ -f "$GITHUB_WORKSPACE/AppIcon.icns" ]; then
            cp "$GITHUB_WORKSPACE/AppIcon.icns" "$APP_BUNDLE/Contents/Resources/"
            echo "✓ AppIcon.icns copied"
          else
            echo "⚠️  AppIcon.icns not found — app will show generic icon"
          fi
          
          # 拷贝 Sparkle.framework
          if [ -d "${{ env.SPARKLE_FRAMEWORK }}" ]; then
            cp -R "${{ env.SPARKLE_FRAMEWORK }}" "$APP_BUNDLE/Contents/Frameworks/"
            
            # 重新签名 Sparkle 嵌套组件（ad-hoc 签名）
            SPARKLE_FW="$APP_BUNDLE/Contents/Frameworks/Sparkle.framework"
            find "$SPARKLE_FW" -type f -name "*.dylib" -exec codesign --force \
              --sign - {} \; 2>/dev/null || true
            codesign --force --sign - "$SPARKLE_FW" 2>/dev/null || true
            
            echo "✓ Sparkle.framework copied and signed"
          fi
          
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUM="${{ github.run_number }}"
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      # ── ad-hoc 代码签名 ──
      - name: Code Sign App
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/dist/$APP_NAME.app"
          
          # ad-hoc 签名（免费，无需 Developer ID）
          codesign --force --sign - --timestamp=none "$APP"
          
          echo "✓ App signed with ad-hoc signature"

      # ── 创建 DMG ──
      - name: Create DMG
        id: package
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/dist/$APP_NAME.app"
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_FILE="$GITHUB_WORKSPACE/dist/${APP_NAME}-${VERSION}.dmg"
          
          # 准备 staging 目录
          STAGING="$GITHUB_WORKSPACE/staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/$APP_NAME.app"
          ln -s /Applications "$STAGING/Applications"
          
          # 添加安装说明文件
          printf '%s\n' \
            "安装方法：" \
            "1. 将 EasyPaste.app 拖到 Applications 文件夹" \
            "2. 首次打开如遇安全警告：" \
            "   → 打开'系统设置 → 隐私与安全性'" \
            "   → 点击'仍要打开'" \
            "   或右键点击应用 → 打开" \
            "" \
            "更新方式：" \
            "EasyPaste 支持自动检查更新。" \
            "菜单栏 → 检查更新…" \
            > "$STAGING/README.txt"

          # 创建 DMG
          hdiutil create -srcfolder "$STAGING" -volname "$APP_NAME" \
            -fs HFS+ -format UDZO \
            "$DMG_FILE"
          
          rm -rf "$STAGING"
          
          echo "dmg_path=$DMG_FILE" >> "$GITHUB_OUTPUT"
          echo "✓ DMG created: $DMG_FILE"

      # ── 提取版本信息 ──
      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUM="${{ github.run_number }}"
          SIZE=$(stat -f%z "${{ steps.package.outputs.dmg_path }}")
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      # ── 上传 DMG 到 Release ──
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.dmg_path }}
          body: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false

      # ── 生成 appcast.xml ──
      - name: Generate appcast.xml
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          SIZE="${{ steps.version.outputs.size }}"
          DMG_FILE="${{ env.APP_NAME }}-${VERSION}.dmg"
          DMG_URL="https://github.com/liudding/EasyPaste/releases/download/${GITHUB_REF_NAME}/${DMG_FILE}"
          
          # 获取 Release body 作为 release notes
          python3 << 'PYEOF'
          import json, os, html
          from datetime import datetime, timezone
          
          event = json.loads(open(os.environ["GITHUB_EVENT_PATH"]).read())
          release = event.get("release", {})
          raw_notes = release.get("body", "") or ""
          
          release_notes = html.escape(raw_notes, quote=False)
          release_notes = release_notes.replace("\r\n", "\n").replace("\r", "\n")
          release_notes = release_notes.replace("\n", "<br />\n")
          
          version = os.environ["VERSION"]
          build = os.environ["BUILD"]
          size = os.environ["SIZE"]
          dmg_url = os.environ["DMG_URL"]
          pub_date = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")
          
          appcast = f"""<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="https://sparkle-project.org/schema/sparkle" xmlns:dc="https://purl.org/dc/elements/1.1/">
            <channel>
              <title>{html.escape(os.environ["APP_NAME"])} Updates</title>
              <link>https://liudding.github.io/easypaste-updates/</link>
              <description>Latest updates for {html.escape(os.environ["APP_NAME"])}</description>
              <item>
                <title>Version {html.escape(version)}</title>
                <description><![CDATA[{release_notes}]]></description>
                <pubDate>{pub_date}</pubDate>
                <enclosure url="{dmg_url}"
                           sparkle:version="{build}"
                           sparkle:shortVersionString="{html.escape(version)}"
                           length="{size}"
                           type="application/octet-stream" />
              </item>
            </channel>
          </rss>"""
          
          with open("appcast.xml", "w", encoding="utf-8") as f:
              f.write(appcast)
          print("✓ appcast.xml generated")
          PYEOF
        env:
          APP_NAME: ${{ env.APP_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          SIZE: ${{ steps.version.outputs.size }}
          DMG_URL: "https://github.com/liudding/EasyPaste/releases/download/${{ github.ref_name }}/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg"

      # ── 上传 appcast.xml 到 GitHub Release ──
      - name: Upload appcast.xml to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: appcast.xml
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 部署 appcast 到 GitHub Pages ──
      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./
      #     keep_files: true
