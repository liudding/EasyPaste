# ============================================================================
# EasyPaste — GitHub Actions 自动打包发布（ad-hoc 签名版）
#
# 架构策略
#   - arm64  ：在 arm64 runner 上原生构建（swift build --arch arm64）。
#   - x86_64 ：在同一 arm64 runner 上交叉编译（swift build --arch x86_64），
#              Swift 工具链可原生交叉编译，无需 Rosetta。
# 产物名遵循 .build/<arch>-apple-macosx/release 的 SwiftPM 6.x 目录布局。
#
# 触发条件：创建 tag v* 时自动运行，或手动触发。
# ============================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: '跳过公证（ad-hoc 签名时无需公证）'
        type: boolean
        default: true
        required: false
      build_arch:
        description: '构建架构（arm64 或 x86_64，空表示两者都构建）'
        type: choice
        options:
          - ""
          - arm64
          - x86_64
        default: ""

permissions:
  contents: write   # 创建 Release 和上传资产

env:
  APP_NAME: EasyPaste
  BUNDLE_ID: com.easypaste.app

jobs:
  build-arm64:
    name: Build DMG (arm64)
    runs-on: macos-15
    if: inputs.build_arch == '' || inputs.build_arch == 'arm64'
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      dmg_path: ${{ steps.meta.outputs.dmg_path }}
      size: ${{ steps.meta.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install dependencies
        run: brew install jq python3

      - name: Setup Sparkle (framework + sign_update)
        run: |
          SPARKLE_VERSION="2.9.4"
          SPARKLE_DIR="$HOME/.cache/sparkle-${SPARKLE_VERSION}"
          if [ ! -d "$SPARKLE_DIR" ]; then
            curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/sparkle.tar.xz
            tar -xJf /tmp/sparkle.tar.xz -C /tmp/
            EXTRACTED=$(ls -d /tmp/Sparkle-* 2>/dev/null | head -1)
            cp -R "$EXTRACTED" "$SPARKLE_DIR"
            rm -f /tmp/sparkle.tar.xz
          fi
          echo "SPARKLE_FRAMEWORK=$SPARKLE_DIR/Sparkle.framework" >> "$GITHUB_ENV"
          echo "SPARKLE_BIN=$SPARKLE_DIR/bin" >> "$GITHUB_ENV"

      - name: Compute version
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & Package
        env:
          ARCH: arm64
          VERSION: ${{ env.VERSION }}
          SPARKLE_FRAMEWORK: ${{ env.SPARKLE_FRAMEWORK }}
        run: bash scripts/package.sh

      - name: Collect metadata
        id: meta
        run: |
          DMG="dist/${APP_NAME}-${{ env.VERSION }}-arm64.dmg"
          echo "version=${{ env.VERSION }}" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Upload Release Asset (DMG-arm64)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-arm64.dmg
          token: ${{ secrets.GITHUB_TOKEN }}

  build-x86_64:
    name: Build DMG (x86_64)
    runs-on: macos-15
    if: inputs.build_arch == '' || inputs.build_arch == 'x86_64'
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      dmg_path: ${{ steps.meta.outputs.dmg_path }}
      size: ${{ steps.meta.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install dependencies
        run: brew install jq python3

      - name: Setup Sparkle (framework + sign_update)
        run: |
          SPARKLE_VERSION="2.9.4"
          SPARKLE_DIR="$HOME/.cache/sparkle-${SPARKLE_VERSION}"
          if [ ! -d "$SPARKLE_DIR" ]; then
            curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/sparkle.tar.xz
            tar -xJf /tmp/sparkle.tar.xz -C /tmp/
            EXTRACTED=$(ls -d /tmp/Sparkle-* 2>/dev/null | head -1)
            cp -R "$EXTRACTED" "$SPARKLE_DIR"
            rm -f /tmp/sparkle.tar.xz
          fi
          echo "SPARKLE_FRAMEWORK=$SPARKLE_DIR/Sparkle.framework" >> "$GITHUB_ENV"
          echo "SPARKLE_BIN=$SPARKLE_DIR/bin" >> "$GITHUB_ENV"

      - name: Compute version
        id: ver
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & Package
        env:
          ARCH: x86_64
          VERSION: ${{ env.VERSION }}
          SPARKLE_FRAMEWORK: ${{ env.SPARKLE_FRAMEWORK }}
        run: bash scripts/package.sh

      - name: Collect metadata
        id: meta
        run: |
          DMG="dist/${APP_NAME}-${{ env.VERSION }}-x86_64.dmg"
          echo "version=${{ env.VERSION }}" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Upload Release Asset (DMG-x86_64)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.dmg
          token: ${{ secrets.GITHUB_TOKEN }}

  generate-appcast:
    name: Generate appcast.xml
    runs-on: macos-15
    needs: [build-arm64, build-x86_64]
    if: needs.build-arm64.result == 'success' && (needs.build-x86_64.result == 'success' || needs.build-x86_64.result == 'skipped')
    outputs:
      appcast_path: ${{ steps.generate.outputs.appcast_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install jq python3

      - name: Setup Sparkle (for sign_update)
        run: |
          SPARKLE_VERSION="2.9.4"
          SPARKLE_DIR="$HOME/.cache/sparkle-${SPARKLE_VERSION}"
          if [ ! -d "$SPARKLE_DIR" ]; then
            curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/sparkle.tar.xz
            tar -xJf /tmp/sparkle.tar.xz -C /tmp/
            EXTRACTED=$(ls -d /tmp/Sparkle-* 2>/dev/null | head -1)
            cp -R "$EXTRACTED" "$SPARKLE_DIR"
            rm -f /tmp/sparkle.tar.xz
          fi
          echo "SPARKLE_BIN=$SPARKLE_DIR/bin" >> "$GITHUB_ENV"

      - name: Download DMGs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern "${APP_NAME}-*.dmg" --dir dist
          ls -la dist

      - name: Generate signed dual-arch appcast.xml
        id: generate
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-arm64.outputs.version }}"
          BUILD_ARM64="${{ needs.build-arm64.outputs.build }}"
          SIZE_ARM64="${{ needs.build-arm64.outputs.size }}"
          BUILD_X86_64="${{ needs.build-x86_64.outputs.build }}"
          SIZE_X86_64="${{ needs.build-x86_64.outputs.size }}"
          MIN_OS="15.0"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          GH_BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"

          # 有私钥则签名（Sparkle 在 SUPublicEDKey 存在时强制校验 edSignature）；
          # 否则生成未签名 appcast（仅用于测试，真实更新会被客户端拒绝）。
          SIGN_ARGS=()
          if [ -n "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            KEYFILE="$(mktemp)"
            printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"
            SIGN_UPDATE="$SPARKLE_BIN/sign_update"
            if [ ! -x "$SIGN_UPDATE" ]; then
              echo "❌ sign_update 工具未找到: $SIGN_UPDATE" >&2
              exit 1
            fi
            sign_dmg() {
              local dmg="$1" key="$2" tool="$3"
              "$tool" --ed-key-file "$key" "$dmg"
            }
            ARM_SIGN=$(sign_dmg "dist/${APP_NAME}-${VERSION}-arm64.dmg" "$KEYFILE" "$SIGN_UPDATE")
            X86_SIGN=$(sign_dmg "dist/${APP_NAME}-${VERSION}-x86_64.dmg" "$KEYFILE" "$SIGN_UPDATE")
            ED_ARM=$(echo "$ARM_SIGN" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
            LEN_ARM=$(echo "$ARM_SIGN" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')
            ED_X86=$(echo "$X86_SIGN" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
            LEN_X86=$(echo "$X86_SIGN" | sed -n 's/.*length="\([0-9]*\)".*/\1/p')
            rm -f "$KEYFILE"
            ARM_SIG_ATTR="sparkle:edSignature=\"$ED_ARM\""
            X86_SIG_ATTR="sparkle:edSignature=\"$ED_X86\""
          else
            echo "⚠️ 未配置 secrets.SPARKLE_ED_PRIVATE_KEY，生成【未签名】appcast（真实更新会被 Sparkle 拒绝）。"
            LEN_ARM="$SIZE_ARM64"
            LEN_X86="$SIZE_X86_64"
            ARM_SIG_ATTR=""
            X86_SIG_ATTR=""
          fi

          cat > appcast.xml << XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="https://sparkle-project.org/schema/sparkle" xmlns:dc="https://purl.org/dc/elements/1.1/">
          <channel>
          <title>EasyPaste</title>
          <link>https://github.com/${{ github.repository }}</link>
          <description>Latest updates for EasyPaste</description>
          <item>
          <title>Version ${VERSION} (arm64)</title>
          <pubDate>${PUB_DATE}</pubDate>
          <enclosure url="${GH_BASE_URL}${APP_NAME}-${VERSION}-arm64.dmg"
          sparkle:version="${BUILD_ARM64}"
          sparkle:shortVersionString="${VERSION}"
          ${ARM_SIG_ATTR}
          length="${LEN_ARM}"
          type="application/octet-stream" />
          <sparkle:minimumSystemVersion>${MIN_OS}</sparkle:minimumSystemVersion>
          </item>
          <item>
          <title>Version ${VERSION} (x86_64)</title>
          <pubDate>${PUB_DATE}</pubDate>
          <enclosure url="${GH_BASE_URL}${APP_NAME}-${VERSION}-x86_64.dmg"
          sparkle:version="${BUILD_X86_64}"
          sparkle:shortVersionString="${VERSION}"
          ${X86_SIG_ATTR}
          length="${LEN_X86}"
          type="application/octet-stream" />
          <sparkle:minimumSystemVersion>${MIN_OS}</sparkle:minimumSystemVersion>
          </item>
          </channel>
          </rss>
          XML
          echo "✓ appcast.xml generated"
          cat appcast.xml
          echo "appcast_path=$(pwd)/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Upload Release Asset (appcast.xml)
        uses: softprops/action-gh-release@v2
        with:
          files: appcast.xml
          token: ${{ secrets.GITHUB_TOKEN }}
