name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Sparkle
        run: |
          SPARKLE_VERSION="2.9.4"
          SPARKLE_DIR="$HOME/.cache/sparkle-${SPARKLE_VERSION}"
          if [ ! -d "$SPARKLE_DIR" ]; then
            mkdir -p /tmp/sparkle-extract
            cd /tmp/sparkle-extract
            curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o sparkle.tar.xz
            tar -xJf sparkle.tar.xz
            mkdir -p "$SPARKLE_DIR"
            cp -R ./* "$SPARKLE_DIR/"
            cd /
            rm -rf /tmp/sparkle-extract
          fi
          echo "SPARKLE_FRAMEWORK=$SPARKLE_DIR/Sparkle.framework" >> "$GITHUB_ENV"

      - name: Build
        run: |
          export ARCH=$(uname -m)
          export VERSION="0.0.0"
          bash scripts/package.sh

      - name: Verify the bundle
        run: |
          test -x dist/EasyPaste.app/Contents/MacOS/EasyPaste
          codesign --verify --deep --strict dist/EasyPaste.app

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPaste-app
          path: dist/EasyPaste.app
