name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          export ARCH=$(uname -m)
          export VERSION="0.0.0"
          bash scripts/package.sh

      - name: Verify the bundle
        run: |
          test -x dist/EasyPaste.app/Contents/MacOS/EasyPaste
          codesign --verify --deep --strict dist/EasyPaste.app
          test -d dist/EasyPaste.app/Contents/Frameworks/Sparkle.framework

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPaste-app
          path: dist/EasyPaste.app
